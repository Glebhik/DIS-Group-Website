<?xml version="1.0" encoding="UTF-8"?>
<!-- DIS Group Logo V3 — Stacked Geometric (presentations / signage) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-label="DIS Group — Dismelt Irish Services Group">
  <defs>
    <!-- Arrowhead -->
    <marker id="v3-arr" viewBox="0 0 12 10" refX="11" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9"
            orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#4ade80"/>
    </marker>
    <!-- Badge background gradient -->
    <linearGradient id="v3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2245"/>
      <stop offset="100%" stop-color="#040c1e"/>
    </linearGradient>
    <!-- Globe gradient -->
    <radialGradient id="v3-globe" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <!-- Globe clip -->
    <clipPath id="v3-gclip">
      <circle cx="140" cy="116" r="52"/>
    </clipPath>
    <!-- Green gradient for D -->
    <linearGradient id="v3-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="v3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── HEXAGONAL BADGE (clipped with path) ── -->
  <!-- Hexagon background -->
  <polygon points="140,8 248,68 248,188 140,248 32,188 32,68"
           fill="url(#v3-bg)"/>
  <!-- Hexagon border outer -->
  <polygon points="140,8 248,68 248,188 140,248 32,188 32,68"
           fill="none" stroke="#16a34a" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Hexagon border inner -->
  <polygon points="140,18 240,73 240,183 140,238 40,183 40,73"
           fill="none" stroke="#16a34a" stroke-width="0.6" stroke-opacity="0.2"/>

  <!-- Corner accent dots on hexagon vertices -->
  <circle cx="140" cy="8"   r="3" fill="#16a34a" opacity="0.8"/>
  <circle cx="248" cy="68"  r="3" fill="#16a34a" opacity="0.8"/>
  <circle cx="248" cy="188" r="3" fill="#16a34a" opacity="0.8"/>
  <circle cx="140" cy="248" r="3" fill="#16a34a" opacity="0.8"/>
  <circle cx="32"  cy="188" r="3" fill="#16a34a" opacity="0.8"/>
  <circle cx="32"  cy="68"  r="3" fill="#16a34a" opacity="0.8"/>

  <!-- ── GLOBE BACKGROUND CIRCLE ── -->
  <circle cx="140" cy="116" r="52" fill="url(#v3-globe)" filter="url(#v3-glow)"/>
  <!-- Globe lines -->
  <g clip-path="url(#v3-gclip)" stroke="#bfdbfe" fill="none">
    <line x1="88" y1="116" x2="192" y2="116" stroke-width="0.9" opacity="0.65"/>
    <path d="M 96,100 Q 140,95 184,100" stroke-width="0.8" opacity="0.4"/>
    <path d="M 96,132 Q 140,137 184,132" stroke-width="0.8" opacity="0.4"/>
    <path d="M 104,86  Q 140,80 176,86"  stroke-width="0.7" opacity="0.3"/>
    <path d="M 104,146 Q 140,152 176,146" stroke-width="0.7" opacity="0.3"/>
    <line x1="140" y1="64" x2="140" y2="168" stroke-width="0.9" opacity="0.6"/>
    <path d="M 140,64 C 162,80 162,152 140,168" stroke-width="0.8" opacity="0.5"/>
    <path d="M 140,64 C 118,80 118,152 140,168" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- Globe highlight -->
  <circle cx="122" cy="97" r="15" fill="white" opacity="0.1"/>
  <!-- Globe border ring -->
  <circle cx="140" cy="116" r="52" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- ── D FORMED BY RECYCLING ARROWS ── -->
  <!-- Arc center: (100, 128), radius: 68 -->

  <!-- D stem -->
  <rect x="67" y="60" width="13" height="136" rx="6.5" fill="url(#v3-green)"/>

  <!-- Arrow 1 (top segment) -->
  <path d="M 100,60 A 68,68 0 0 1 155.6,90.4"
        stroke="url(#v3-green)" stroke-width="11" stroke-linecap="round" fill="none"
        marker-end="url(#v3-arr)"/>
  <!-- Arrow 2 (middle segment) -->
  <path d="M 161.6,102.5 A 68,68 0 0 1 161.6,153.5"
        stroke="url(#v3-green)" stroke-width="11" stroke-linecap="round" fill="none"
        marker-end="url(#v3-arr)"/>
  <!-- Arrow 3 (bottom segment) -->
  <path d="M 155.6,165.6 A 68,68 0 0 1 100,196"
        stroke="url(#v3-green)" stroke-width="11" stroke-linecap="round" fill="none"
        marker-end="url(#v3-arr)"/>

  <!-- ── WRENCH ── integrated bottom-right of hex interior -->
  <g transform="translate(195,185) rotate(-45) scale(1.2)">
    <!-- Wrench head (ring) -->
    <circle r="11" fill="none" stroke="#1f2937" stroke-width="6.5"/>
    <!-- Handle -->
    <rect x="-4" y="9" width="8" height="20" rx="4" fill="#1f2937"/>
    <!-- Jaw gap (top) -->
    <rect x="-4" y="-17" width="8" height="8" fill="#0e2245"/>
  </g>
  <!-- Wrench glow -->
  <circle cx="195" cy="185" r="18" fill="none" stroke="#374151" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- ── "DIS" TEXT overlaid in D interior ── -->
  <text x="138" y="136"
        font-family="'Rajdhani','Arial Black',sans-serif"
        font-weight="700" font-size="44"
        fill="white" fill-opacity="0.18"
        letter-spacing="2" text-anchor="middle">DIS</text>

  <!-- ── TEXT BELOW HEXAGON ── -->
  <!-- Horizontal rule -->
  <line x1="60" y1="268" x2="220" y2="268" stroke="#16a34a" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- DIS GROUP -->
  <text x="140" y="290"
        font-family="'Rajdhani','Arial Black',sans-serif"
        font-weight="700" font-size="30"
        fill="white" letter-spacing="9" text-anchor="middle">DIS GROUP</text>

  <!-- Tagline -->
  <text x="140" y="311"
        font-family="'Arial','Helvetica',sans-serif"
        font-weight="400" font-size="8.5"
        fill="#4a6080" letter-spacing="2.2" text-anchor="middle">DISMELT IRISH SERVICES GROUP</text>

</svg>
